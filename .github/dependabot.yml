# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Do not create a branch named `dependabot`. Git refuses `dependabot/...` update
# branches while that exact ref exists, and security updates stop running.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/examples/wallet-extension/wasm-crypto"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/examples/wallet-extension/fixture-gen"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/examples/wallet-extension"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/examples/coins/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
