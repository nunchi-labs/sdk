name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      wallet: ${{ steps.filter.outputs.wallet }}
      wallet-live: ${{ steps.filter.outputs.wallet-live }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect Rust Changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            rust:
              - '*.rs'
              - '**/*.rs'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.lock'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - '.github/workflows/**'
              - 'Justfile'
              - '**/Dockerfile'
            frontend:
              - 'examples/coins/frontend/**'
            wallet:
              - 'examples/wallet-extension/**'
            wallet-live:
              - 'examples/wallet-extension/**'
              - 'examples/coins/chain/**'
              - 'coins/**'
              - 'crypto/**'
              - 'common/**'
              - 'rpc/**'
              - 'chain/**'
              - 'xtask/**'

  fmt:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  test-and-coverage:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install mold
        run: command -v mold || (sudo apt-get update && sudo apt-get install -y mold)

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: llvm-tools-preview

      - name: Install llvm-cov
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: nextest

      - name: Run Tests and Collect Coverage
        run: |
          cargo llvm-cov --locked --all-features --no-report nextest --workspace --all-targets
          cargo llvm-cov report --locked --codecov --output-path codecov.info

      - name: Run doctests
        run: cargo test --locked --workspace --all-features --doc

      - name: Test wallet wasm-crypto
        run: cargo test --locked --manifest-path examples/wallet-extension/wasm-crypto/Cargo.toml

      - name: Upload Coverage Data
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          fail_ci_if_error: false
          files: codecov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rust

  unused-dependencies:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install mold
        run: command -v mold || (sudo apt-get update && sudo apt-get install -y mold)

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: nightly

      - name: Install udeps
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-udeps

      - name: Check Unused Dependencies
        run: cargo +nightly udeps --locked --all-features --all-targets

  clippy:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Dependencies
        run: |
          (command -v mold && pkg-config --exists fontconfig) || \
            (sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1-dev mold)

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy

      - name: Run Clippy
        run: cargo clippy --locked --all --all-features --all-targets -- -D warnings

  wallet-test:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.wallet == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/wallet-extension/package-lock.json

      - name: Run wallet extension tests
        working-directory: examples/wallet-extension
        run: npm ci && npm test

  wallet-live:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.wallet-live == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install mold
        run: command -v mold || (sudo apt-get update && sudo apt-get install -y mold)

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: wasm32-unknown-unknown
          rustflags: ""

      - name: Install wasm-pack
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: wasm-pack

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/wallet-extension/package-lock.json

      - name: Install wallet dependencies
        working-directory: examples/wallet-extension
        run: npm ci

      - name: Build wallet wasm
        working-directory: examples/wallet-extension
        run: npm run build:wasm

      - name: Build coins-chain binaries
        run: cargo build --locked -p nunchi-coins-chain --bins -p xtask

      - name: Broadcast a wallet transfer on a local testnet
        run: ./examples/wallet-extension/scripts/run-live-tests.sh

  frontend:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/coins/frontend/package-lock.json

      - name: Typecheck coins frontend
        working-directory: examples/coins/frontend
        run: npm ci && npx tsc --noEmit
