<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nunchi wallet home</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shot">
      <div class="popup">
        <div class="header">
          <h1>Nunchi Wallet</h1>
          <div style="display: flex; gap: 8px">
            <button class="icon">Lock</button>
            <button class="icon">Set</button>
          </div>
        </div>
        <div class="content">
          <div class="addressCard">
            <div>nch1q...8v2k</div>
            <span>Copy</span>
          </div>
          <div class="networkBadge">local / nunchi-local (http://localhost:8545)</div>
          <div class="balanceSection">
            <div class="balanceLabel">Balance</div>
            <div class="balanceValue">1,250</div>
            <div class="subtitle">display coin from Settings</div>
          </div>
          <div class="actions">
            <button class="primary" style="padding: 10px 16px">Send</button>
            <button class="secondary" style="padding: 10px 16px">Activity</button>
          </div>
        </div>
      </div>
      <div class="caption">nch addresses, local RPC, and transfer history</div>
    </div>
  </body>
</html>
