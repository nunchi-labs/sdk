<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Approve a Nunchi transaction</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shot">
      <div class="popup">
        <div class="header">
          <h2>Send Transaction</h2>
        </div>
        <div class="content">
          <div class="detailCard">
            <div class="detailRow">
              <span>Site</span>
              <div class="mono">https://app.example</div>
            </div>
            <div class="detailRow">
              <span>From</span>
              <div class="mono">nch1jse7wvv4fhj7r7rg307a9nn5fsum4gv23pnudva725w7mhcpu2tsk096jm</div>
            </div>
            <div class="detailRow">
              <span>To</span>
              <div class="mono">nch1g053yaztclz5sngrkhzh4xaucc2wpktf7qzz4yn3vnknat706peq075klx</div>
            </div>
            <div class="detailRow">
              <span>Amount</span>
              <div class="mono">1000</div>
            </div>
          </div>
          <button class="secondary">Reject</button>
          <button class="primary">Confirm</button>
        </div>
      </div>
      <div class="caption">Pages only get connection, sign, and send after you approve</div>
    </div>
  </body>
</html>
