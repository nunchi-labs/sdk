<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nunchi Wallet Test Fixtures</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #0a0e17;
      color: #e8eaed;
    }
    h1 { color: #3b82f6; }
    .test { 
      margin: 20px 0;
      padding: 15px;
      background: #141824;
      border: 1px solid #2a2f3e;
      border-radius: 8px;
    }
    .pass { border-left: 4px solid #10b981; }
    .fail { border-left: 4px solid #ef4444; }
    .label { color: #9aa0a6; font-size: 12px; }
    .value { margin-top: 5px; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>Nunchi Wallet WASM Crypto Test Fixtures</h1>
  <div id="tests"></div>

  <script type="module">
    import init, * as wasm from './src/wasm/nunchi_wallet_crypto.js';

    const tests = document.getElementById('tests');

    async function runTests() {
      await init();

      // Test 1: Verify address format (should be ~62 chars, start with nch1)
      await testAddressFormat();

      // Test 2: Import and verify address derivation
      await testAddressDerivation();

      // Test 3: Transaction signing and digest
      await testTransactionSigning();

      // Test 4: Verify Bech32 encoding (not Bech32m)
      await testBech32Encoding();
    }

    async function testAddressFormat() {
      const testDiv = document.createElement('div');
      testDiv.className = 'test';
      tests.appendChild(testDiv);

      try {
        const ed25519 = wasm.generate_ed25519_keypair();
        const secp256r1 = wasm.generate_secp256r1_keypair();

        const ed25519Valid = ed25519.address.startsWith('nch1') && ed25519.address.length >= 60 && ed25519.address.length <= 65;
        const secp256r1Valid = secp256r1.address.startsWith('nch1') && secp256r1.address.length >= 60 && secp256r1.address.length <= 65;

        testDiv.className = (ed25519Valid && secp256r1Valid) ? 'test pass' : 'test fail';
        testDiv.innerHTML = `
          <strong>Address Format (Bech32, HRP nch)</strong>
          <div class="label">Ed25519 Address:</div>
          <div class="value">${ed25519.address} (${ed25519.address.length} chars)</div>
          <div class="label">Valid:</div>
          <div class="value">${ed25519Valid ? '✓ YES' : '✗ NO'}</div>
          <div class="label">Secp256r1 Address:</div>
          <div class="value">${secp256r1.address} (${secp256r1.address.length} chars)</div>
          <div class="label">Valid:</div>
          <div class="value">${secp256r1Valid ? '✓ YES' : '✗ NO'}</div>
        `;
      } catch (error) {
        testDiv.className = 'test fail';
        testDiv.innerHTML = `
          <strong>Address Format</strong>
          <div class="error">ERROR: ${error.message}</div>
        `;
      }
    }

    async function testBech32Encoding() {
      const testDiv = document.createElement('div');
      testDiv.className = 'test';
      tests.appendChild(testDiv);

      try {
        const keyPair = wasm.generate_ed25519_keypair();
        const valid = wasm.validate_address(keyPair.address);
        
        // Bech32 addresses have a checksum that should validate
        testDiv.className = valid ? 'test pass' : 'test fail';
        testDiv.innerHTML = `
          <strong>Bech32 Encoding (not Bech32m)</strong>
          <div class="label">Address:</div>
          <div class="value">${keyPair.address}</div>
          <div class="label">Validates:</div>
          <div class="value">${valid ? '✓ YES' : '✗ NO'}</div>
          <div class="label">Note:</div>
          <div class="value">Uses Bech32 (not Bech32m) with HRP 'nch'</div>
        `;
      } catch (error) {
        testDiv.className = 'test fail';
        testDiv.innerHTML = `
          <strong>Bech32 Encoding</strong>
          <div class="error">ERROR: ${error.message}</div>
        `;
      }
    }

    async function testAddressDerivation() {
      const testDiv = document.createElement('div');
      testDiv.className = 'test';
      tests.appendChild(testDiv);

      try {
        const keyPair = wasm.generate_ed25519_keypair();
        const valid = wasm.validate_address(keyPair.address);
        const reImported = wasm.import_private_key(keyPair.private_key_hex);
        const addressMatch = keyPair.address === reImported.address;

        testDiv.className = (valid && addressMatch) ? 'test pass' : 'test fail';
        testDiv.innerHTML = `
          <strong>Address Generation & Import Roundtrip</strong>
          <div class="label">Generated Address:</div>
          <div class="value">${keyPair.address}</div>
          <div class="label">Valid Bech32:</div>
          <div class="value">${valid ? '✓ YES' : '✗ NO'}</div>
          <div class="label">Re-import Match:</div>
          <div class="value">${addressMatch ? '✓ YES' : '✗ NO'}</div>
        `;
      } catch (error) {
        testDiv.className = 'test fail';
        testDiv.innerHTML = `
          <strong>Address Generation</strong>
          <div class="error">ERROR: ${error.message}</div>
        `;
      }
    }

    async function testTransactionSigning() {
      const testDiv = document.createElement('div');
      testDiv.className = 'test';
      tests.appendChild(testDiv);

      try {
        const keyPair = wasm.generate_ed25519_keypair();
        const to = wasm.generate_ed25519_keypair();
        
        // Sign with nonce 0
        const signed = wasm.sign_transfer(
          keyPair.private_key_hex,
          0,
          'a1b2c3d4e5f6',
          keyPair.address,
          to.address,
          '1000'
        );

        // Verify digest is 64 hex chars (32 bytes SHA256)
        const digestValid = signed.digest_hex.length === 64;
        
        // Transaction should be encoded (has account_id, payload, authorization)
        const txValid = signed.transaction_hex.length > 100;

        testDiv.className = (digestValid && txValid) ? 'test pass' : 'test fail';
        testDiv.innerHTML = `
          <strong>Transaction Signing</strong>
          <div class="label">From:</div>
          <div class="value">${keyPair.address.substring(0, 20)}...</div>
          <div class="label">To:</div>
          <div class="value">${to.address.substring(0, 20)}...</div>
          <div class="label">Transaction Digest (SHA256):</div>
          <div class="value">${signed.digest_hex.substring(0, 16)}... (${signed.digest_hex.length / 2} bytes)</div>
          <div class="label">Transaction Bytes:</div>
          <div class="value">${signed.transaction_hex.length / 2} bytes (inner coins Transaction)</div>
          <div class="label">Valid:</div>
          <div class="value">${(digestValid && txValid) ? '✓ YES' : '✗ NO'}</div>
        `;
      } catch (error) {
        testDiv.className = 'test fail';
        testDiv.innerHTML = `
          <strong>Transaction Signing</strong>
          <div class="error">ERROR: ${error.message}</div>
        `;
      }
    }

    runTests().catch(console.error);
  </script>
</body>
</html>
